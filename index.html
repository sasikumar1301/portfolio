    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts (display=swap) load after the first contentful paint, so they never compete with the
         app bundle. First paint uses system fonts; once every face is ready, html.fonts switches all three
         families at once: one reflow instead of one per font file. -->
    <script>
      (function () {
        var started = false;
        function loadFonts() {
          if (started) return;
          started = true;
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap";
          link.onload = function () {
            var faces = ["400 1em Inter", "500 1em Inter", "600 1em Inter", "500 1em 'Space Grotesk'", "700 1em 'Space Grotesk'", "400 1em 'JetBrains Mono'", "500 1em 'JetBrains Mono'"];
            Promise.all(faces.map(function (f) { return document.fonts.load(f); }))
              .then(function () { document.documentElement.classList.add("fonts"); }, function () {});
          };
          document.head.appendChild(link);
        }
        try {
          new PerformanceObserver(function (list) {
            if (list.getEntriesByName("first-contentful-paint").length) setTimeout(loadFonts, 0);
          }).observe({ type: "paint", buffered: true });
        } catch (e) {}
        addEventListener("load", function () { setTimeout(loadFonts, 2500); }); // fallback without paint timing
      })();
    </script>
